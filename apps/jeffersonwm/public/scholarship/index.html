<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bill Jefferson</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="keywords" content="Bill Jefferson, 1000 Dollars" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V3NQ37RBWY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V3NQ37RBWY');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans+Condensed:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --frame: 42px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: var(--frame);
        background: #fdfdfd;
        color: #111827;
        font-family: "IBM Plex Sans Condensed", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        position: relative;
        isolation: isolate;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("/jeffersonwm/images/backgrounds/jeffwm-feed-lion-pattern-20260627.jpeg");
        background-repeat: repeat;
        background-size: 900px auto;
        opacity: 0.05;
        pointer-events: none;
        z-index: -1;
      }

      .layout {
        position: relative;
        z-index: 1;
      }

      .logo-wrapper {
        margin-bottom: 0.75rem;
      }

      .logo {
        display: block;
        height: 84px;
        width: 84px;
      }

      h1 {
        margin: 0;
        font-family: "Young Serif", "Times New Roman", serif;
        font-size: clamp(2rem, 3vw, 2.4rem);
        font-weight: 400;
      }

      .identity-links {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin-top: 1.75rem;
      }

      .identity-links a {
        color: inherit;
        font-size: 1rem;
        font-weight: 500;
        text-decoration: none;
      }

      .identity-links a:hover {
        text-decoration: underline;
        text-underline-offset: 0.18rem;
      }

      .project-note {
        color: #5f665f;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 1rem;
      }

      @media (max-width: 720px) {
        :root {
          --frame: 24px;
        }

        .logo {
          height: 72px;
          width: 72px;
        }
      }
    </style>
  </head>
  <body>
    <main class="layout" aria-label="Scholarship">
      <div class="logo-wrapper">
        <img src="/favicon.svg" alt="" class="logo" />
      </div>
      <div class="identity-block">
        <h1>Bill Jefferson</h1>
        <p class="project-note">I have about 20 projects going on, here are the main ones.</p>
        <nav class="identity-links" aria-label="Scholarship links">
          <a href="https://wmjefferson.com/" target="_blank" rel="noopener noreferrer">Professional</a>
          <a href="https://jeffersonwm.com/jeffersonwm/" target="_blank" rel="noopener noreferrer">Personal</a>
          <a href="https://jeffershizzle.com/" target="_blank" rel="noopener noreferrer">Creative</a>
          <a href="https://dookydetective.com/" target="_blank" rel="noopener noreferrer">Dog</a>
          <a href="https://github.com/wmjefferson/" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
      </div>
    </main>
  </body>
</html>
