<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perihelion</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.svg" />
  <meta name="robots" content="noindex" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --frame: 36px;
      --topbar-height: 36px;
      --top-gap: 6px;
      --footer-height: 36px;
      --body-top-offset: calc(var(--topbar-height) + var(--top-gap));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter Tight", "Segoe UI", Arial, sans-serif;
      background-color: #f2f2f2;
      color: #202522;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      background-image: url("./images/backgrounds/peri-cameras-pattern.png");
      background-position: top left;
      background-repeat: repeat;
      content: "";
      inset: 0;
      opacity: 0.028;
      pointer-events: none;
      position: fixed;
      z-index: 0;
    }

    .shell-frame {
      width: calc(100% - (var(--frame) * 2));
      max-width: 100%;
      margin: 0 auto;
    }

    .shell-frame--body {
      padding-top: var(--body-top-offset);
      padding-bottom: calc(var(--footer-height) + 24px);
      position: relative;
      z-index: 20;
    }

    .shell-gutters {
      pointer-events: none;
      position: fixed;
      inset: var(--topbar-height) 0 var(--footer-height);
      z-index: 5;
    }

    .shell-gutter {
      border-left: 1px solid #e5e5e5;
      bottom: 0;
      position: absolute;
      top: 0;
    }

    .shell-gutter--left {
      left: var(--frame);
    }

    .shell-gutter--right {
      right: var(--frame);
    }

    .page-banner {
      background: rgba(250, 250, 250, 0.93);
      border-bottom: 1px solid #e5e5e5;
      left: 0;
      min-height: var(--topbar-height);
      padding: 0;
      position: fixed;
      right: 0;
      z-index: 1000;
    }

    .page-banner--top {
      top: 0;
    }

    .page-banner--bottom {
      bottom: 0;
      top: auto;
      border-top: 1px solid #e5e5e5;
      border-bottom: 0;
    }

    .page-banner__inner {
      min-height: var(--topbar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .page-banner__brand,
    .page-banner__link,
    .page-banner__button {
      color: #202522;
      font-family: "Inter Tight", "Segoe UI", Arial, sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      text-decoration: none;
      transition: color 150ms ease;
    }

    .page-banner__brand:hover,
    .page-banner__link:hover,
    .page-banner__button:hover {
      color: #de8bf7;
    }

    .page-banner__nav {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-banner__copyright {
      margin: 0;
      line-height: 1;
      text-align: right;
      font-size: 0.875rem;
      letter-spacing: 0;
      color: #6b7280;
    }

    .page-banner__copyright-link {
      color: #111827;
      text-decoration: none;
      transition: color 1000ms ease;
    }

    .page-banner__copyright-link--primary {
      font-weight: 600;
    }

    .page-banner__copyright-link:hover {
      color: #de8bf7;
      transition-duration: 150ms;
    }

    .quiet-home-stage {
      min-height: calc(100vh - var(--body-top-offset) - var(--footer-height) - 24px);
    }
  </style>
</head>
<body>
  <div class="shell-gutters" aria-hidden="true">
    <div class="shell-gutter shell-gutter--left"></div>
    <div class="shell-gutter shell-gutter--right"></div>
  </div>

  <header class="page-banner page-banner--top">
    <div class="page-banner__inner shell-frame">
      <a class="page-banner__brand" href="./home">Perihelion</a>
      <nav class="page-banner__nav" aria-label="Perihelion pages">
        <a class="page-banner__link" href="./home?view=gallery">Gallery</a>
        <a class="page-banner__link" href="https://auth.jeffersonwm.com/home">Sign in</a>
      </nav>
    </div>
  </header>

  <div class="shell-frame shell-frame--body">
    <main role="main">
      <section class="quiet-home-stage" aria-label="Perihelion home"></section>
    </main>
  </div>

  <footer class="page-banner page-banner--bottom">
    <div class="page-banner__inner shell-frame">
      <span aria-hidden="true"></span>
      <p class="page-banner__copyright">
        &copy; 2026
        <a href="https://jeffersonwm.com" class="page-banner__copyright-link page-banner__copyright-link--primary">Jefferson Williams</a>.
        All rights reserved.
        <a href="https://github.com/wmjefferson/jeffersonwm" class="page-banner__copyright-link">GitHub</a>.
      </p>
    </div>
  </footer>
</body>
</html>
